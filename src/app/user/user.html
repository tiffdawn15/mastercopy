<div>
  <h1 class="title">Your saved artworks</h1>
  @if (user$ | async; as user) {
  <h2>Welcome, {{ user.name }}</h2>
  <p>Email: {{ user.email }}</p>
  }

  <mat-card class="center-card">
    <h2>It can be hard to get started...</h2>
    <img src="../../assets/undraw_artist-at-work_yos7.svg" alt="Artist at work" />
    <button mat-raised-button color="primary" (click)="homePage()">Start Browsing...</button>
  </mat-card>
</div>
